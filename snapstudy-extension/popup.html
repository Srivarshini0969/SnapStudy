<!DOCTYPE html>
<html>
<head>

    body { width: 280px; padding: 16px; font-family: sans-serif; }
    input { width: 100%; margin: 6px 0; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>SnapStudy Login</h3>
  <input type="email" id="email" placeholder="Email" />

  <p id="status" style="font-size: 13px; margin-top: 10px;"></p>
  <script src="popup.js"></script>
</body>
</html>
